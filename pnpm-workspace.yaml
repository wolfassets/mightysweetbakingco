packages:
  - 'apps/web-a'
  - 'apps/web-b'
  - 'apps/web-c'
  - 'apps/api'

# `apps/ios` is intentionally excluded — it's a SwiftUI/Xcode project,
# not a Node package.

allowBuilds:
  '@biomejs/biome': true
  '@clerk/shared': true
  '@parcel/watcher': true
  better-sqlite3: true
  core-js: true
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - '@biomejs/biome'
  - '@clerk/shared'
  - '@parcel/watcher'
  - better-sqlite3
  - core-js
  - esbuild
  - sharp
